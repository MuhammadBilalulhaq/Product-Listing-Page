<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated to stable Bootstrap v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Daraz | Online Shopping</title>
    <link rel="icon" type="image/x-icon" href="./Assets/cart-shopping-solid-full.svg">
</head>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid ">
    <a class="navbar-brand" href="#">Daraz</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse " id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ">   
<select id="category" class="form-select" name="category" onchange="filterShoes(event)">
    <option value="">All Categories</option>
    <option value="Footwear">Footwear</option>
    <option value="Bags">Bags</option>
    <option value="Electronics">Electronics</option>
     <option value="Fragrance">Fragrance</option>
     <option value="Beauty">Beauty</option>
    <option value="Accessories">Accessories</option>
    <option value="Lifestyle">Lifestyle</option>
</select>
<select id="brand" class="form-select" name="brand" onchange="filterShoes(event)">
    <option value="">All Brands</option>
     <option value="Nike">Nike</option>
     <option value="Artisan Leather">Artisan Leather</option>
     <option value="Polaroid">Polaroid</option>
     <option value="Chanel">Chanel</option>
    <option value="Dior">Dior</option>
    <option value="Gucci">Gucci</option>
    <option value="AudioTech">AudioTech</option>
    <option value="Hugo Boss">Hugo Boss</option>
    <option value="Designer">Designer</option>
    <option value="Vans">Vans</option>
    <option value="Faberlic">Faberlic</option>
    <option value="Apple">Apple</option>
    <option value="Handmade">Handmade</option>
    <option value="Ray-Ban">Ray-Ban</option>
    <option value="Bottega-style">Bottega-style</option>
    <option value="Hydro Flask">Hydro Flask</option>
    <option value="Generic">Generic</option>
</select>
        <select id="size" class="form-select" name="size" onchange="filterShoes(event)">
    <option value="">All Sizes</option>
    <option value="XL">XL</option>
    <option value="Large">Large</option>
    <option value="Medium">Medium</option>
    <option value="Small">Small</option>
</select>


        
<select id="color" class="form-select" name="color" onchange="filterShoes(event)">
    <option value="">All Colors</option>
    <option value="Black">Black</option>
    <option value="Burgundy">Burgundy</option>
    <option value="White and Dark Gray">White and Dark Gray</option>
    <option value="Peach">Peach</option>
    <option value="Pink and Teal">Pink and Teal</option>
    <option value="Neon Yellow/Green">Neon Yellow/Green</option>
    <option value="Clear and Green">Clear and Green</option>
    <option value="Multi-colored">Multi-colored</option>
    <option value="Red">Red</option>
    <option value="Orange">Orange</option>
    <option value="Teal">Teal</option>
    <option value="Brown">Brown</option>
    <option value="Matte Green">Matte Green</option>
    <option value="White">White</option>
</select>


<select class="form-select" name="price" onchange="filterShoes(event)">
    <option value="">All Prices</option>
    <option value="0-25">Under $25</option>
    <option value="25-50">$25 - $50</option>
    <option value="50-100">$50 - $100</option>
    <option value="100+">Above $100</option>
</select>
      </ul>
      <form class="d-flex" role="search">
        <button class="btn btn-outline-danger" onclick="resetFilters()"  type="submit">clear</button>
      </form>
    </div>
  </div>
</nav>
        
    </nav>
    <div  class="container my-5 ">
        <div class="row" id="products-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
